; ============================================================================
; DumperPro - games.ini
; All offsets and signatures live here. Add a new game without recompiling.
; Values accept hex (0x10) or decimal. A value of 0 means "auto-detect".
;
; Sections named after the game image (prefix match) are picked automatically:
;   Game-Win64-Shipping.exe  ->  [Game]
; ============================================================================

[Global]
; verbose = 1
; probe = 400              ; object samples for runtime offset probing
; vtable.minindex = 8      ; reject suspiciously low vtable slots (0-1 = MSVC destructors)

; ---- explicit addresses (skip scanning entirely) ----
; gobjects = 0x00007FF6AABBCCDD
; gnames   = 0x00007FF6AABBCCDD

; ---- explicit patterns (scanned + validated before built-in sigs) ----
; gobjects_pattern = 48 8B 05 ?? ?? ?? ?? 48 8D 54 24 ?? E8
; gnames_pattern   = 48 8D 35 ?? ?? ?? ?? EB 16

; ---- vtable fingerprints (override/extend per function, '|' separates alternatives) ----
; fingerprint.ProcessEvent = 4C 8B DC 49 89 5B ?? 49 89 6B ?? 49 89 73 ?? 57 41 56 41 57 48 81 EC ?? ?? ?? ??
; fingerprint.PostRender   = 48 89 5C 24 ?? 48 89 74 24 ?? 57 48 83 EC 30 48 8B F9 48 8B DA 48 8B 49 60

; ============================================================================
; Game sections: any dotted offset key below is understood by DumperPro.
; Keys: uobject.flags/index/class/name/outer, ufield.next,
;       ffield.enabled, ffield.class/owner/next/name/flags,
;       property.arraydim/elementsize/flags/offset, property.objectclass/struct/
;       array_inner/set_inner/map_key/map_value/enum/bool_bytemask/bool_fieldmask,
;       struct.super/children/childproperties/propertiessize, class.cdo,
;       enum.names, function.paramssize/flags/func,
;       array.chunks_ptr/max_elements/num_elements/max_chunks/num_chunks/
;       item_stride/chunk_size, array.flat
; ============================================================================

; ---------------------------------------------------------------
; Example: a UE 5.3 game with known addresses
; ---------------------------------------------------------------
; [MyGame]
; version = 5.3
; gobjects = 0x7FF6A1234568
; gnames   = 0x7FF6A1234ABC
; ; leave everything below at 0 to let the runtime probe fill it in
; class.cdo = 0
; function.func = 0

; ---------------------------------------------------------------
; Example: a custom UE 4.27 build with tweaked struct layout
; ---------------------------------------------------------------
; [CustomUE427]
; version = 4.27
; struct.propertiessize = 0x48
; property.offset = 0x4C
; array.item_stride = 0x18
; array.chunk_size = 0x2800
; array.flat = 0

; ---------------------------------------------------------------
; Example: UE 5.4 / UE 5.5 games. In DumperPro's model these use
; the same FUObjectArray/FNamePool layout as UE 5.3 (the runtime
; OffsetProbe confirms it per build). Only override individual
; offsets here if the probe disagrees or the probe needs a hint.
; ---------------------------------------------------------------
; [MyGameUE54]
; version = 5.4
; gobjects = 0x7FF6A1234568
; gnames   = 0x7FF6A1234ABC
; ; first run without the two keys below, check offsets.txt, then pin them:
; array.item_stride = 0x18
; array.chunk_size  = 0x10000

; [MyGameUE55]
; version = 5.5
; ; addresses found by a --device (LeechCore) raw scan are fine too:
; gobjects = 0x1A2B3C4000
; gnames   = 0x1A2B3C8000

; ---------------------------------------------------------------
; Example: per-function vtable fingerprints. Overrides/extends the
; built-in candidates in VTableResolver ('|' separates alternat-
; ives). Looked up in [game] fingerprint.<Name> first, then the
; [Fingerprints] section below. Every candidate must still pass
; vtable slot validation before it is accepted.
; ---------------------------------------------------------------
; [Fingerprints]
; fingerprint.ProcessEvent = 4C 8B DC 49 89 5B ?? 49 89 6B ?? 49 89 73 ?? 57 41 56 41 57 48 81 EC ?? ?? ?? ??|48 89 5C 24 ?? 48 89 6C 24 ?? 48 89 74 24 ?? 57 41 56 41 57 48 81 EC ?? ?? ?? ?? 49 8B F9
; fingerprint.PostRender   = 48 89 5C 24 ?? 48 89 74 24 ?? 57 48 83 EC 30 48 8B F9 48 8B DA 48 8B 49 60
; fingerprint.ProcessRemoteFunction = 48 89 5C 24 ?? 55 56 57 41 54 41 55 41 56 41 57 48 81 EC ?? ?? ?? ??
